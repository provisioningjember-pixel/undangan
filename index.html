<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Tema Undangan Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Navbar Navigation -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="#" class="text-xl font-bold text-rose-600 flex items-center gap-2">
        <i class="fa-solid fa-heart"></i> UndanganKita
      </a>
      <div id="authNav">
        <button onclick="simulasiLogin()" class="bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition">
          <i class="fa-solid fa-right-to-bracket mr-1"></i> Masuk / Daftar (Demo)
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="bg-gradient-to-b from-rose-50 to-slate-50 py-12 px-4 text-center">
    <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">Katalog Tema Undangan Digital</h1>
    <p class="mt-3 text-slate-600 max-w-xl mx-auto text-base">Pilih dari 20 pilihan desain, klik preview & edit untuk melihat tampilan penuhnya.</p>
  </header>

  <!-- Main Catalog Grid (20 Tema) -->
  <main class="max-w-7xl mx-auto px-4 py-10">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="catalogGrid">
      <!-- 20 Card Tema di-render oleh JavaScript -->
    </div>
  </main>

  <!-- JavaScript Murni (Tanpa Database/Firebase) -->
  <script>
    // Data Dummy 20 Tema Undangan
    const templates = [
      { id: "rustic-01", name: "Rustic Floral", desc: "Nuansa kayu hangat dengan ornamen bunga kayu estetik.", img: "https://images.unsplash.com/photo-1519741497674-611481863552?w=600&auto=format&fit=crop", tag: "Best Seller" },
      { id: "elegant-01", name: "Modern Gold", desc: "Kombinasi font serif anggun dan aksen emas mewah.", img: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=600&auto=format&fit=crop", tag: "Populer" },
      { id: "minimalist-01", name: "Clean Minimalist", desc: "Desain simpel, bersih, dan fokus pada tipografi modern.", img: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=600&auto=format&fit=crop" },
      { id: "traditional-01", name: "Jawa Classic", desc: "Motif batikan dan ornamen khas tradisi budaya Jawa.", img: "https://images.unsplash.com/photo-1606800052052-a08af7148866?w=600&auto=format&fit=crop" },
      { id: "boho-01", name: "Boho Chic", desc: "Sentuhan warna terracotta dan ornamen daun kering pampas.", img: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=600&auto=format&fit=crop", tag: "Baru" },
      { id: "emerald-01", name: "Royal Emerald", desc: "Perpaduan warna hijau zamrud dan monokrom elegan.", img: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?w=600&auto=format&fit=crop" },
      { id: "pastel-01", name: "Soft Pastel", desc: "Warna peach dan pink lembut yang romantis.", img: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600&auto=format&fit=crop" },
      { id: "vintage-01", name: "Vintage Paper", desc: "Gaya kertas klasik dengan ilustrasi garis tangan.", img: "https://images.unsplash.com/photo-1529636798458-92182e662485?w=600&auto=format&fit=crop" },
      { id: "sunda-01", name: "Sunda Modern", desc: "Sentuhan adat Sunda dengan konsep tata letak kekinian.", img: "https://images.unsplash.com/photo-1532712938310-34cb3982ef74?w=600&auto=format&fit=crop" },
      { id: "navy-01", name: "Midnight Navy", desc: "Warna biru gelap premium bersanding dengan font emas.", img: "https://images.unsplash.com/photo-1545232979-fbf592320755?w=600&auto=format&fit=crop", tag: "Favorit" },
      { id: "botanical-01", name: "Green Botanical", desc: "Ilustrasi dedaunan segar untuk konsep pesta outdoor.", img: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=600&auto=format&fit=crop" },
      { id: "luxury-01", name: "Luxury Black Gold", desc: "Nuansa hitam gelap dipadu foil emas bertema eksklusif.", img: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=600&auto=format&fit=crop" },
      { id: "islamic-01", name: "Arabic Ornament", desc: "Ornamen Islami yang rapi, bersih, dan menyejukkan.", img: "https://images.unsplash.com/photo-1544078751-58fee2d8a03b?w=600&auto=format&fit=crop" },
      { id: "rose-01", name: "Rose Gold Glam", desc: "Kombinasi warna rose gold yang manis dan berkilau.", img: "https://images.unsplash.com/photo-1469371670807-013ccf25f16a?w=600&auto=format&fit=crop" },
      { id: "monochrome-01", name: "Monochrome Modern", desc: "Perpaduan hitam putih kontras tinggi yang minimalis.", img: "https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=600&auto=format&fit=crop" },
      { id: "beach-01", name: "Tropical Beach", desc: "Nuansa pantai santai untuk destination wedding.", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop" },
      { id: "terracotta-01", name: "Warm Terracotta", desc: "Warna tanah liat hangat yang estetik dan kekinian.", img: "https://images.unsplash.com/photo-1523438885200-e635ba2c371e?w=600&auto=format&fit=crop" },
      { id: "watercolor-01", name: "Watercolor Floral", desc: "Lukisan cat air bunga halus yang artistik.", img: "https://images.unsplash.com/photo-1509924603848-aca5e5f276d7?w=600&auto=format&fit=crop" },
      { id: "maroon-01", name: "Maroon Classic", desc: "Warna merah marun tegas bertema formal kebangsawan.", img: "https://images.unsplash.com/photo-1525310072745-f49212b5ac6d?w=600&auto=format&fit=crop" },
      { id: "lavender-01", name: "Soft Lavender", desc: "Nuansa ungu muda yang menenangkan dan romantis.", img: "https://images.unsplash.com/photo-1508615070457-7baeba4003ab?w=600&auto=format&fit=crop" }
    ];

    // Render 20 Card Tema ke Grid
    const catalogGrid = document.getElementById('catalogGrid');
    catalogGrid.innerHTML = templates.map(t => `
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col">
        <div class="relative h-52 bg-slate-100 overflow-hidden">
          <img src="${t.img}" alt="${t.name}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
          ${t.tag ? `<span class="absolute top-3 right-3 bg-rose-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">${t.tag}</span>` : ''}
        </div>
        <div class="p-4 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="text-lg font-bold text-slate-800">${t.name}</h3>
            <p class="text-xs text-slate-500 mt-1 line-clamp-2">${t.desc}</p>
          </div>
          <div class="mt-5">
            <a href="./preview.html?template=${t.id}" class="block w-full text-center bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-medium py-2.5 rounded-xl text-sm transition">
              <i class="fa-solid fa-eye mr-1.5"></i> Preview & Edit
            </a>
          </div>
        </div>
      </div>
    `).join('');

    // Simulasi Login Dummy sederhana (tanpa database)
    function simulasiLogin() {
      const authNav = document.getElementById('authNav');
      authNav.innerHTML = `
        <div class="flex items-center gap-3">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=DemoUser" class="w-8 h-8 rounded-full border border-rose-300 bg-rose-100">
          <span class="text-sm font-medium text-slate-700 hidden sm:inline">User Demo</span>
          <button onclick="simulasiLogout()" class="text-slate-500 hover:text-rose-600 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      `;
    }

    function simulasiLogout() {
      const authNav = document.getElementById('authNav');
      authNav.innerHTML = `
        <button onclick="simulasiLogin()" class="bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition">
          <i class="fa-solid fa-right-to-bracket mr-1"></i> Masuk / Daftar (Demo)
        </button>
      `;
    }
  </script>
</body>
</html>
